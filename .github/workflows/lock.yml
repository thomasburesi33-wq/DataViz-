# Garde uv.lock synchronisé avec pyproject.toml sur main.
# Filet de sécurité : en temps normal, `uv add` met à jour les deux fichiers et on les commite ensemble.
name: Verrouillage des dépendances

on:
  push:
    branches: [main]
    paths: [pyproject.toml, .github/workflows/lock.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv lock
      - name: Commiter uv.lock s'il a changé
        run: |
          if [ -n "$(git status --porcelain uv.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "Génère uv.lock à partir de pyproject.toml"
            git push
          fi
